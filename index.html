<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn system design with lesson text, step-by-step hand-drawn diagrams and quizzes." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#a8c8bb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem("theme")
        var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(d ? "dark" : "light")
        if (d) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1115")
      } catch (e) {}
    </script>
    <title>Learn system design</title>
  </head>
  <body class="min-h-screen bg-desk text-foreground font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
